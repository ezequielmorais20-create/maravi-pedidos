<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAVI Achadinhos e Variedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho compacto, faixa fixa com busca e categorias, grade de produtos; demonstração em abas. */
:root{
  --rosa-claro:#FCE8EF; --rosa:#E58BA4; --vinho:#741039; --texto:#3a1424; --cinza:#7a6670; --linha:#f0cfda; --branco:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e5f5ec; --sim:#9a5b00; --sim-bg:#fff3e0; --erro:#b42318;
  --display:'Fraunces',Georgia,serif; --corpo:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--rosa-claro);color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.4}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--vinho);color:#fff;position:sticky;top:0;z-index:6}
.bar{display:flex;align-items:center;gap:10px;height:54px}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--rosa-claro);background:var(--rosa-claro);display:block}
.marca{font-family:var(--display);font-size:1.1rem;line-height:1}
.marca small{display:block;font-family:var(--corpo);font-size:.7rem;opacity:.85;margin-top:2px}
.sp{flex:1}
.btn{background:var(--vinho);color:#fff;border:0;border-radius:10px;padding:.55rem .9rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--branco);color:var(--vinho);border:1px solid var(--vinho)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{background:var(--rosa);color:var(--texto)}
.badge{background:var(--vinho);color:#fff;border-radius:999px;padding:0 .45rem;margin-left:.3rem;font-size:.78rem}
.modos{background:var(--branco);border-bottom:1px solid var(--linha)}
.modos .wrap{display:flex;gap:6px;padding-top:6px;padding-bottom:6px}
.modos button{flex:1;border:1px solid var(--linha);background:var(--branco);border-radius:10px;padding:.4rem;font-weight:700;cursor:pointer;color:var(--cinza)}
.modos button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.intro{padding:10px 0 2px}
h1{font-family:var(--display);color:var(--vinho);font-size:clamp(1.15rem,4.2vw,1.6rem);line-height:1.2;margin:0;text-wrap:balance}
.intro p{margin:2px 0 0;font-size:.9rem;color:var(--cinza)}
.filtros{position:sticky;top:54px;z-index:5;background:var(--rosa-claro);padding:8px 0;display:grid;gap:8px}
.filtros input{width:100%;padding:.55rem .8rem;border:1px solid var(--linha);border-radius:10px;background:var(--branco)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.grade{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);padding:4px 0 96px}
@media (min-width:640px){.grade{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.foto{aspect-ratio:1/1;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;color:var(--vinho);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:.55rem .65rem .7rem;display:flex;flex-direction:column;gap:2px;flex:1}
.cat{color:var(--cinza);font-size:.76rem}
.nome{font-weight:700;font-size:.95rem;line-height:1.2}
.preco{color:var(--vinho);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05rem}
.disp{font-size:.78rem;font-weight:700}
.disp.ok{color:var(--ok)} .disp.pouco{color:var(--sim)} .disp.fim{color:var(--erro)}
.card .btn{margin-top:auto}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:.1rem .55rem;border-radius:999px;border:1px solid var(--linha);background:var(--rosa-claro);color:var(--vinho)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:#bfe3cf}
.tag.sim{background:var(--sim-bg);color:var(--sim);border-color:#f6d9a8}
.tag.err{background:#fdeceb;color:var(--erro);border-color:#f3c3bf}
aside{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--branco);border-left:1px solid var(--linha);z-index:10;display:none;flex-direction:column}
aside.on{display:flex}
aside .topo{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--linha)}
aside h2,.demo h2{font-family:var(--display);color:var(--vinho);margin:0;font-size:1.25rem}
aside .corpo{padding:10px 16px;overflow:auto;flex:1}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha)}
.item .g{flex:1}
.q{display:inline-flex;gap:6px;align-items:center}
.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--linha);background:var(--branco);cursor:pointer}
label{display:block;font-size:.85rem;color:var(--cinza);margin:10px 0 3px}
select,input.t,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--linha);border-radius:10px;background:var(--branco)}
.tot{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}
.tot.g{font-weight:800;color:var(--vinho);font-size:1.1rem;border-top:1px solid var(--linha);margin-top:6px;padding-top:8px}
.rodape{padding:12px 16px;border-top:1px solid var(--linha);display:grid;gap:8px}
.aviso{background:var(--rosa-claro);border:1px dashed var(--rosa);border-radius:10px;padding:.6rem .75rem;font-size:.88rem}
.msg{font-size:.86rem;color:var(--cinza);margin:0}
.okt{color:var(--ok);font-weight:800}
#flut{position:fixed;left:16px;right:16px;bottom:16px;z-index:4;display:none}
#flut .btn{width:100%;padding:.8rem;box-shadow:0 6px 18px rgba(116,16,57,.35)}
@media (min-width:700px){#flut{left:auto;width:320px}}
/* demonstração */
.demo{padding:10px 0 60px}
.legenda{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:.8rem;display:grid;gap:.5rem;margin-bottom:12px}
.legenda div{display:flex;gap:.5rem;align-items:flex-start;font-size:.88rem}
.legenda .tag{flex:0 0 auto;margin-top:2px}
.abas{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none}
.abas button{flex:0 0 auto;border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:.35rem .9rem;cursor:pointer;font-weight:700}
.abas button[aria-pressed=true]{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.tela{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
.tela .sim-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tela h3{margin:.6rem 0 .3rem;font-size:1rem;color:var(--vinho)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--linha);vertical-align:top}
th{color:var(--cinza);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.stat{border:1px solid var(--linha);border-radius:12px;padding:.6rem}
.stat b{display:block;font-size:1.2rem;color:var(--vinho);font-variant-numeric:tabular-nums}
.stat.d{border-color:var(--vinho)}
.qr{width:180px;height:180px;margin:6px auto;display:block;border:1px solid var(--linha);border-radius:10px;background:var(--branco)}
.copia{word-break:break-all;font-family:ui-monospace,monospace;font-size:.72rem;background:var(--rosa-claro);padding:.5rem;border-radius:8px}
.tl{list-style:none;margin:0;padding:0 0 0 .5rem;border-left:2px solid var(--rosa)}
.tl li{padding:0 0 .6rem .9rem;position:relative;font-size:.9rem}
.tl li::before{content:"";position:absolute;left:-7px;top:.3rem;width:11px;height:11px;border-radius:50%;background:var(--vinho)}
input.t.s{margin-bottom:6px}
footer{padding:20px 0 60px;color:var(--cinza);font-size:.85rem}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>

  <div class="topo"><h2>Sua sacola</h2><button class="btn sec sm" id="fechar">Fechar</button></div>
  <div class="corpo" id="itens"></div>
  <div class="rodape" id="rod"></div>
</aside>

<script>
/* ====== CONFIGURAÇÃO DA LOJA (edite aqui) ====== */
const WHATSAPP = "5598985066724";  // WhatsApp da loja: (98) 98506-6724 (só dígitos, com DDI e DDD)
const ZONAS = [{nome:"São Raimundo e entorno",taxa:500},{nome:"Centro e bairros próximos",taxa:800}];
/* Produtos da planilha de cadastro da MARAVI. preco em centavos. estoque: número de unidades, ou null = ainda não informado (a loja confirma). foto = endereço da imagem (vazio = sem foto). */
const PRODUTOS = [
  {id:1,nome:"Piranha de cabelo",cat:"Acessórios",preco:1000,estoque:400,foto:""},
  {id:2,nome:"Pó solto de banana",cat:"Maquiagem",preco:1000,estoque:400,foto:""},
  {id:3,nome:"Gloss 1",cat:"Maquiagem",preco:1000,estoque:400,foto:""},
  {id:4,nome:"Gloss 2",cat:"Maquiagem",preco:1000,estoque:400,foto:""},
  {id:5,nome:"Gloss 3",cat:"Maquiagem",preco:1000,estoque:400,foto:""},
  {id:6,nome:"Prendedor de cabelo",cat:"Acessórios",preco:1000,estoque:400,foto:""},
  {id:7,nome:"Lenço demaquilante",cat:"Cuidados com a pele",preco:1000,estoque:400,foto:""},
  {id:8,nome:"Blush 1",cat:"Maquiagem",preco:1000,estoque:400,foto:""},
  {id:9,nome:"Acessórios 1",cat:"Acessórios",preco:1000,estoque:400,foto:""},
  {id:10,nome:"Acessórios 2",cat:"Acessórios",preco:1000,estoque:400,foto:""},
  {id:11,nome:"Rímel",cat:"Maquiagem",preco:1500,estoque:400,foto:""},
  {id:12,nome:"Esfoliante corporal",cat:"Cuidados com a pele",preco:1500,estoque:400,foto:""},
  {id:13,nome:"Esfoliante facial",cat:"Cuidados com a pele",preco:1500,estoque:400,foto:""},
  {id:14,nome:"Hidratante",cat:"Cuidados com a pele",preco:1500,estoque:400,foto:""},
  {id:15,nome:"Paleta de sombras",cat:"Maquiagem",preco:1500,estoque:400,foto:""},
  {id:16,nome:"Blush 2",cat:"Maquiagem",preco:1500,estoque:400,foto:""},
  {id:17,nome:"Óculos",cat:"Óculos",preco:2000,estoque:400,foto:""}
];
/* =============================================== */
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $=id=>document.getElementById(id);
const P=id=>PRODUTOS.find(p=>p.id===id);
const EST=p=>p.estoque==null?Infinity:p.estoque;
const cor={"Maquiagem":"#E58BA4","Cuidados com a pele":"#f4b6c7","Acessórios":"#f8cfdb","Óculos":"#d9a3b5"};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
let filtro="Todos",termo="",sacola=[],entrega="retirada",zona=0,obs="";

/* ---------- loja ---------- */
function chips(){
  const cats=["Todos",...new Set(PRODUTOS.map(p=>p.cat))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===filtro}" data-c="${c}">${c}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{filtro=b.dataset.c;chips();grade();});
}
function disp(p){if(p.estoque==null)return `<span class="disp">Consulte a disponibilidade</span>`;return p.estoque<=0?`<span class="disp fim">Esgotado</span>`:p.estoque<=3?`<span class="disp pouco">Restam ${p.estoque}</span>`:`<span class="disp ok">Disponível</span>`}
function grade(){
  const t=termo.toLowerCase();
  const l=PRODUTOS.filter(p=>(filtro==="Todos"||p.cat===filtro)&&p.nome.toLowerCase().includes(t));
  $("grade").innerHTML=l.length?l.map(p=>`<article class="card"><div class="foto" style="background:${cor[p.cat]||"#f4b6c7"}">${p.foto?`<img src="${p.foto}" alt="${p.nome}" loading="lazy">`:`<span aria-hidden="true">${p.nome[0]}</span>`}</div><div class="b"><span class="cat">${p.cat}</span><span class="nome">${p.nome}</span><span class="preco">${brl(p.preco)}</span>${disp(p)}<button class="btn" data-id="${p.id}" ${EST(p)<=0?"disabled":""}>${EST(p)<=0?"Indisponível":"Adicionar"}</button></div></article>`).join(""):`<p class="msg">Nenhum produto encontrado.</p>`;
  $("grade").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>add(+b.dataset.id));
}
function add(id){const l=sacola.find(x=>x.id===id);if(l){if(l.q<EST(P(id)))l.q++;}else sacola.push({id,q:1});salvar();desenhar();}
function mudar(id,d){const l=sacola.find(x=>x.id===id);if(!l)return;l.q=Math.min(l.q+d,EST(P(id)));if(l.q<1)sacola=sacola.filter(x=>x.id!==id);salvar();desenhar();}
function salvar(){try{localStorage.setItem("maravi.sacola",JSON.stringify(sacola))}catch(e){}}
function totais(){const sub=sacola.reduce((a,l)=>a+P(l.id).preco*l.q,0);const frete=entrega==="entrega"?ZONAS[zona].taxa:0;return{sub,frete,total:sub+frete};}
function texto(){
  const t=totais();
  const ls=sacola.map(l=>`${l.q}x ${P(l.id).nome} - ${brl(P(l.id).preco*l.q)}`);
  return ["Olá! Quero fazer um pedido na MARAVI:",...ls,"",`Subtotal: ${brl(t.sub)}`,entrega==="entrega"?`Entrega (${ZONAS[zona].nome}): ${brl(t.frete)}`:"Retirada na loja",`Total: ${brl(t.total)}`,obs?`Observações: ${obs}`:"","Vou pagar e envio o comprovante por aqui."].join("\n");
}

/* ===== PDF do pedido (gerado no próprio aparelho, sem enviar dados a terceiros) ===== */
function numPedido(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function pdfPedido(num){
  const t=totais(),W=595,H=842,M=40;
  const cl=s=>String(s).replace(/[^\x20-\xFF]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  const wd=(s,sz)=>{let w=0;for(const c of String(s)){w+=/[0-9]/.test(c)?556:c===" "||c==="."||c===","?278:/[A-Z]/.test(c)?667:/[mwMW]/.test(c)?800:/[ilItfj]/.test(c)?260:540}return w*sz/1000};
  const pages=[];let cur,y;
  const nova=()=>{cur=[];pages.push(cur);y=H-M;};
  const txt=(s,x,yy,sz,b,rgb)=>cur.push(`${rgb||"0.1 0.1 0.1"} rg BT /${b?"F2":"F1"} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${cl(s)}) Tj ET`);
  const dir=(s,xr,yy,sz,b,rgb)=>txt(s,xr-wd(s,sz),yy,sz,b,rgb);
  const rect=(x,yy,w,h,rgb)=>cur.push(`${rgb} rg ${x} ${yy} ${w} ${h} re f`);
  const lin=(yy)=>cur.push(`0.9 0.75 0.8 RG 0.7 w ${M} ${yy} m ${W-M} ${yy} l S`);
  nova();
  rect(0,H-92,W,92,"0.455 0.063 0.224");
  txt("MARAVI",M,H-50,26,true,"1 1 1");txt("Achadinhos e Variedades",M,H-70,11,false,"0.99 0.91 0.94");
  dir("PEDIDO Nº "+num,W-M,H-48,13,true,"1 1 1");
  dir(new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}),W-M,H-68,10,false,"0.99 0.91 0.94");
  y=H-125;
  txt("Resumo do pedido",M,y,15,true,"0.455 0.063 0.224");y-=26;
  const cab=()=>{rect(M,y-6,W-2*M,22,"0.988 0.91 0.937");txt("Qtd",M+8,y,10,true);txt("Produto",M+50,y,10,true);dir("Valor unit.",W-M-95,y,10,true);dir("Subtotal",W-M-8,y,10,true);y-=26;};
  cab();
  for(const l of sacola){const p=P(l.id);if(y<150){nova();y=H-M-10;cab();}
    txt(String(l.q)+"x",M+8,y,11,true);txt(p.nome.length>38?p.nome.slice(0,37)+".":p.nome,M+50,y,11,false);
    dir(brl(p.preco),W-M-95,y,11,false);dir(brl(p.preco*l.q),W-M-8,y,11,true);y-=8;lin(y);y-=18;}
  if(y<190){nova();y=H-M-10;}
  y-=6;const linhaT=(a,b,big)=>{txt(a,W-M-210,y,big?13:11,big);dir(b,W-M-8,y,big?15:11,big,big?"0.455 0.063 0.224":null);y-=big?0:20;};
  linhaT("Subtotal",brl(t.sub));
  linhaT(entrega==="entrega"?"Entrega ("+ZONAS[zona].nome+")":"Entrega",entrega==="entrega"?brl(t.frete):"Retirada - grátis");
  y-=12;rect(W-M-220,y-10,220,32,"0.988 0.91 0.937");
  txt("TOTAL A PAGAR",W-M-210,y,11,true);dir(brl(t.total),W-M-8,y,16,true,"0.455 0.063 0.224");y-=48;
  const linhas=[];
  linhas.push(["Forma de entrega",entrega==="entrega"?"Entrega - "+ZONAS[zona].nome:"Retirada na loja"]);
  if(obs)linhas.push(["Observações",obs.slice(0,90)]);
  for(const [a,b] of linhas){txt(a+": ",M,y,10,true);txt(b,M+wd(a+": ",10)+4,y,10,false);y-=16;}
  y-=10;
  txt("Como pagar",M,y,12,true,"0.455 0.063 0.224");y-=18;
  for(const s of ["1. Envie este PDF pelo WhatsApp da loja: (98) 98506-6724.","2. A loja confirma disponibilidade e combina a forma de pagamento (retirada ou entrega).","3. Pague o valor total acima e envie o comprovante no mesmo WhatsApp.","4. A loja confirma o pagamento e separa o seu pedido."]){txt(s,M,y,10,false);y-=15;}
  y-=10;txt("MARAVI Achadinhos e Variedades - Av. do São Raimundo, São Luís - MA",M,40,8.5,false,"0.45 0.3 0.35");
  const ob=[];const add=s=>{ob.push(s);return ob.length};
  add("<< /Type /Catalog /Pages 2 0 R >>");add("PLACEHOLDER");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids=[];
  for(const pg of pages){const c=pg.join("\n");const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    const pi=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`);kids.push(pi+" 0 R");}
  ob[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`;
  let out="%PDF-1.4\n";const offs=[];
  ob.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${ob.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${ob.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:"application/pdf"});
}
async function baixar(blob,nome){
  if(window.claude&&window.claude.use){try{const d=await Promise.race([window.claude.use("downloads"),new Promise(r=>setTimeout(()=>r(null),4000))]);
    if(d){try{await d.save({filename:nome,data:blob});return true}catch(e){if(e&&e.code==="declined")return false}}}catch(e){}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true}
async function enviarPedido(){
  const st=$("stat");if(!sacola.length)return;
  const num=numPedido(),nome=`Pedido-MARAVI-${num}.pdf`,blob=pdfPedido(num),msg=texto();
  const arq=new File([blob],nome,{type:"application/pdf"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq],text:msg,title:"Pedido MARAVI"});
      st.innerHTML='<span class="okt">Pedido pronto.</span> Escolha o WhatsApp da loja (98) 98506-6724 na lista de compartilhamento.';return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const ok=await baixar(blob,nome);if(!ok)return;
  const link=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(link,"_blank","noopener");
  st.innerHTML='<span class="okt">PDF salvo.</span> No WhatsApp, toque em anexar (clipe) e envie o arquivo <b>'+nome+'</b> junto com a mensagem. Se não abriu, <a href="'+link+'" target="_blank" rel="noopener">toque aqui para abrir o WhatsApp</a>.';
}
function desenhar(){
  const n=sacola.reduce((a,l)=>a+l.q,0);$("cont").textContent=n;
  $("flut").style.display=n&&!$("sacola").classList.contains("on")?"block":"none";
  if(n)$("flutbtn").textContent=`Ver sacola (${n}) · ${brl(totais().total)}`;
  if(!sacola.length){$("itens").innerHTML=`<p class="msg">Sua sacola está vazia.</p>`;$("rod").innerHTML="";return;}
  $("itens").innerHTML=sacola.map(l=>`<div class="item"><div class="g"><div class="nome">${P(l.id).nome}</div><div class="preco">${brl(P(l.id).preco)}</div></div><div class="q"><button data-m="-1" data-id="${l.id}" aria-label="Diminuir">−</button><span>${l.q}</span><button data-m="1" data-id="${l.id}" aria-label="Aumentar" ${l.q>=EST(P(l.id))?"disabled":""}>+</button></div></div>`).join("")+
  `<label for="modo">Como você quer receber?</label><select id="modo"><option value="retirada">Retirar na loja (grátis)</option><option value="entrega">Entrega em casa</option></select>
   <div id="zw" ${entrega==="entrega"?"":"hidden"}><label for="zona">Região</label><select id="zona">${ZONAS.map((z,i)=>`<option value="${i}">${z.nome} - ${brl(z.taxa)}</option>`).join("")}</select></div>
   <label for="obs">Observações (endereço, horário, cor)</label><textarea id="obs" rows="2"></textarea>`;
  $("modo").value=entrega;$("zona").value=zona;$("obs").value=obs;
  $("itens").querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>mudar(+b.dataset.id,+b.dataset.m));
  $("modo").onchange=e=>{entrega=e.target.value;desenhar();};
  $("zona").onchange=e=>{zona=+e.target.value;desenhar();};
  $("obs").oninput=e=>{obs=e.target.value;};
  const t=totais();
  $("rod").innerHTML=`<div class="tot"><span>Subtotal</span><span>${brl(t.sub)}</span></div><div class="tot"><span>Frete</span><span>${entrega==="entrega"?brl(t.frete):"Grátis"}</span></div><div class="tot g"><span>Total</span><span>${brl(t.total)}</span></div>
   <p class="aviso"><b>Pagamento:</b> não é feito pelo site. Envie o pedido pelo WhatsApp (98) 98506-6724, pague conforme combinado com a loja e <b>envie o comprovante nesse mesmo WhatsApp</b>. A loja confirma preço, disponibilidade e o pagamento.</p>
   <button class="btn" id="wa">Enviar pedido pelo WhatsApp (PDF)</button>
   <button class="btn sec" id="pdf">Baixar PDF do pedido</button>
   <a class="btn sec" id="comp" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Olá! Segue o comprovante de pagamento do meu pedido na MARAVI.")}">Enviar comprovante pelo WhatsApp</a>
   <button class="btn sec" id="copiar">Copiar pedido</button><p class="msg" id="stat">Depois de pagar, anexe o comprovante na conversa do WhatsApp.</p>`;
  $("copiar").onclick=async()=>{try{await navigator.clipboard.writeText(texto());$("stat").innerHTML='<span class="okt">Pedido copiado.</span> Cole na conversa com a loja.';}catch(e){$("stat").textContent="Não foi possível copiar. Copie o texto abaixo.";const ta=document.createElement("textarea");ta.className="t";ta.rows=8;ta.value=texto();$("stat").after(ta);}};
  $("wa").onclick=enviarPedido;$("pdf").onclick=async()=>{const n=numPedido();if(!(await baixar(pdfPedido(n),`Pedido-MARAVI-${n}.pdf`)))return;$("stat").innerHTML='<span class="okt">PDF baixado.</span> Envie o arquivo no WhatsApp da loja.';};
}
const abrir=()=>{$("sacola").classList.add("on");desenhar();};
$("abrir").onclick=abrir;$("flutbtn").onclick=abrir;
$("fechar").onclick=()=>{$("sacola").classList.remove("on");desenhar();};
$("busca").oninput=e=>{termo=e.target.value;grade();};

try{sacola=(JSON.parse(localStorage.getItem("maravi.sacola")||"[]")).filter(l=>P(l.id)&&EST(P(l.id))>0).map(l=>({id:l.id,q:Math.min(l.q,EST(P(l.id)))}));}catch(e){sacola=[]}
chips();grade();desenhar();
</script>
</body>
</html>
