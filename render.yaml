# Blueprint do Render em plano Free, usando o PostgreSQL Neon já existente.
# Não adicionar Render Postgres nem disco persistente nesta configuração gratuita.
services:
  - type: web
    name: maravi-pedidos
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    # O Render Free não oferece preDeployCommand; migrações idempotentes rodam no start.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: producao
      - key: PIX_MODE
        value: desabilitado
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false                # inserir a URL secreta do Neon no painel Render
      - key: PIX_WEBHOOK_SECRET
        generateValue: true
      - key: APP_URL
        sync: false                # preencher após o Render gerar a URL pública
      - key: UPLOAD_DIR
        value: /tmp/maravi-uploads # efêmero no Render Free; fotos não persistem
